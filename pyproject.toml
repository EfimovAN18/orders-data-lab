[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orders-data-lab"
version = "0.1.0"
description = "Учебный проект: API заказов, ETL и аналитика продаж"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
orders-lab = "orders_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["orders_lab*"]

[tool.setuptools.package-data]
orders_lab = ["analytics/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"orders_lab/analytics/report.py" = ["E501"]
