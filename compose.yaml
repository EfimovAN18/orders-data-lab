services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: orders_lab
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment: &app-env
      APP_DATABASE_URL: postgresql+psycopg://orders:${POSTGRES_PASSWORD}@db:5432/orders_lab
      WAREHOUSE_PATH: /app/data/warehouse.db
      RAW_DIR: /app/data/raw
      REPORT_DIR: /app/reports
    ports:
      - "127.0.0.1:8000:8000"
    volumes: &app-volumes
      - pipeline-data:/app/data
      - report-data:/app/reports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  pipeline:
    profiles: ["etl"]
    build: .
    environment: *app-env
    volumes: *app-volumes
    command: ["python", "-m", "orders_lab", "pipeline", "--interval", "60"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  pipeline-data:
  report-data:
